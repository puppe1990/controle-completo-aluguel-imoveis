<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Controle Completo de Aluguel de Imoveis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <link rel="stylesheet" href="styles/output.css" />
  </head>
  <body class="min-h-screen">
    <div class="app-shell mx-auto flex min-h-screen max-w-[1680px] gap-6 p-6">
      <aside class="panel app-sidebar hidden shrink-0 lg:flex">
        <div class="space-y-8">
          <div>
            <p
              class="text-xs font-semibold uppercase tracking-[0.3em] text-amber-700"
            >
              Imobiliaria
            </p>
            <h1
              class="mt-4 font-['Instrument_Serif'] text-5xl leading-none text-stone-950"
            >
              Controle completo
            </h1>
          </div>
          <nav id="route-nav" class="nav-stack"></nav>
        </div>
      </aside>

      <main class="flex-1 space-y-6">
        <section class="panel shell-header">
          <div id="page-header" class="header-grid"></div>
        </section>
        <div id="app-view" class="space-y-6"></div>
      </main>
    </div>

    <script src="js/neutralino.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
